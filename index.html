<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abed Textile Processing Mills Ltd. | Textile Expertise. Digital Progress.</title>
  <link rel="icon" type="image/png" href="/img/logos/logos_03.png" />
  <link rel="apple-touch-icon" href="/img/logos/logos_03.png" />
  <meta name="description" content="Abed Textile Processing Mills Limited — Textile Expertise. Digital Progress. Integrated weaving, dyeing, conventional & high-speed digital textile printing (120,000 m/day) in Narsingdi, Bangladesh." />
  <link rel="canonical" href="__SITE_URL__/" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Twitter (per-route values are set at runtime in src/components/Seo.tsx) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Abed Textile Processing Mills Ltd." />
  <meta property="og:title" content="Abed Textile Processing Mills Ltd. | Textile Expertise. Digital Progress." />
  <meta property="og:description" content="Integrated weaving, dyeing, conventional & high-speed digital textile printing (120,000 m/day) in Narsingdi, Bangladesh." />
  <meta property="og:url" content="__SITE_URL__/" />
  <meta property="og:image" content="__SITE_URL__/img/hero/hero_02.webp" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Abed Textile Processing Mills Ltd. | Textile Expertise. Digital Progress." />
  <meta name="twitter:description" content="Integrated weaving, dyeing, conventional & high-speed digital textile printing (120,000 m/day) in Narsingdi, Bangladesh." />
  <meta name="twitter:image" content="__SITE_URL__/img/hero/hero_02.webp" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Abed Textile Processing Mills Ltd.",
    "alternateName": "আবেদ টেক্সটাইল প্রসেসিং মিলস লিমিটেড",
    "slogan": "Textile Expertise. Digital Progress.",
    "url": "__SITE_URL__/",
    "logo": "__SITE_URL__/img/logos/logos_03.png",
    "email": "abedtextilebd@yahoo.com",
    "telephone": "+880 2 9462750",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Ghoradia, Narsingdi Sadar",
      "addressLocality": "Narsingdi",
      "addressCountry": "BD"
    },
    "geo": { "@type": "GeoCoordinates", "latitude": 23.9430798, "longitude": 90.7320136 }
  }
  </script>
  <meta name="theme-color" content="#182722" />
  <meta name="color-scheme" content="light" />

  <!-- LCP: the hero photo is fetched in parallel with the JavaScript bundle instead
       of waiting for React to render it. Keep these URLs in sync with src/assets.ts. -->
  <link rel="preload" as="image" href="/img/hero/hero_02.webp" fetchpriority="high"
        imagesrcset="/img/hero/hero_01.webp 960w, /img/hero/hero_02.webp 1440w, /img/hero/hero_03.webp 1920w"
        imagesizes="100vw" />
  <!-- Self-hosted fonts: preloaded so text paints with the real typeface, no FOUT jiggle. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-latin-var.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-latin-var.woff2" crossorigin />
</head>
<body class="selection:bg-sky-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
