<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abed Textile Processing Mills Ltd. | Textile Expertise. Digital Progress.</title>
  <link rel="icon" type="image/png" href="/img/logos/logos_03.png" />
  <link rel="apple-touch-icon" href="/img/logos/logos_03.png" />
  <meta name="description" content="Abed Textile Processing Mills Limited — Textile Expertise. Digital Progress. Integrated weaving, dyeing, conventional & high-speed digital textile printing (120,000 m/day) in Narsingdi, Bangladesh." />
  <meta name="theme-color" content="#182722" />
  <meta name="color-scheme" content="light" />

  <!-- LCP: the hero photo is fetched in parallel with the JavaScript bundle instead
       of waiting for React to render it. Keep these URLs in sync with src/assets.ts. -->
  <link rel="preload" as="image" href="/img/hero/hero_02.webp" fetchpriority="high"
        imagesrcset="/img/hero/hero_01.webp 960w, /img/hero/hero_02.webp 1440w, /img/hero/hero_03.webp 1920w"
        imagesizes="100vw" />
  <!-- Self-hosted fonts: preloaded so text paints with the real typeface, no FOUT jiggle. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-latin-var.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-latin-var.woff2" crossorigin />
</head>
<body class="selection:bg-sky-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
